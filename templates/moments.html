<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MPC - Moments</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav>

    <div class="logo-text">
        MPC
    </div>

    <div class="nav-links">

        <a href="/">
            HOME
        </a>

        <a href="/leaderboard">
            LEADERBOARD
        </a>

        <a href="/playoff">
            PLAYOFF STAGE
        </a>

        <a href="/moments"
           class="active">
            MOMENTS
        </a>

    </div>

</nav>


<main class="page-container">

    <a href="/" class="back">
        ← KEMBALI
    </a>


    <header class="page-header">

        <h1>
            MOMENTS
        </h1>

        <p>
            MPC TOURNAMENT HIGHLIGHTS
        </p>

    </header>


    <section class="moments-grid">

        {% for moment in moments %}

        <div class="moment-card">

            <video controls
                   preload="metadata">

                <source
                    src="{{ url_for('static', filename='videos/' + moment.video) }}"
                    type="video/mp4">

                Browser anda tidak menyokong video.

            </video>


            <div class="moment-info">

                <h2>
                    {{ moment.title }}
                </h2>

                <p>
                    {{ moment.description }}
                </p>

            </div>

        </div>

        {% endfor %}

    </section>

</main>


<footer>

    © 2026 MPC TOURNAMENT

</footer>


</body>
</html>
